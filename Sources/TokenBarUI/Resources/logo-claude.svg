<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- TokenBar autoral: estrela de 8 raios (interpretação própria, minimalista).
       Identificação visual apenas — sem vínculo com a marca. -->
  <g fill="#000000">
    <rect x="11" y="2" width="2" height="8" rx="1"/>
    <rect x="11" y="14" width="2" height="8" rx="1"/>
    <rect x="2" y="11" width="8" height="2" rx="1"/>
    <rect x="14" y="11" width="8" height="2" rx="1"/>
    <g transform="rotate(45 12 12)">
      <rect x="11" y="2" width="2" height="8" rx="1"/>
      <rect x="11" y="14" width="2" height="8" rx="1"/>
      <rect x="2" y="11" width="8" height="2" rx="1"/>
      <rect x="14" y="11" width="8" height="2" rx="1"/>
    </g>
    <circle cx="12" cy="12" r="2.4"/>
  </g>
</svg>
